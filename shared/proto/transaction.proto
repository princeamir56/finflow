syntax = "proto3";

package transaction;

service TransactionService {
  rpc CreateAccount (CreateAccountRequest) returns (Account);
  rpc GetAccount (GetAccountRequest) returns (Account);
  rpc GetUserAccounts (GetUserAccountsRequest) returns (AccountList);
  rpc Deposit (DepositRequest) returns (Transaction);
  rpc Withdraw (WithdrawRequest) returns (Transaction);
  rpc Transfer (TransferRequest) returns (Transaction);
  rpc GetHistory (GetHistoryRequest) returns (TransactionList);
}

message Account {
  string id = 1;
  string user_id = 2;
  string iban = 3;
  string currency = 4;
  double balance = 5;
  string created_at = 6;
}

message AccountList {
  repeated Account accounts = 1;
}

message Transaction {
  string id = 1;
  string from_account_id = 2;
  string to_account_id = 3;
  double amount = 4;
  string type = 5;
  string status = 6;
  string description = 7;
  string created_at = 8;
}

message TransactionList {
  repeated Transaction transactions = 1;
}

message CreateAccountRequest {
  string user_id = 1;
  string currency = 2;
}

message GetAccountRequest {
  string account_id = 1;
}

message GetUserAccountsRequest {
  string user_id = 1;
}

message DepositRequest {
  string account_id = 1;
  double amount = 2;
  string description = 3;
}

message WithdrawRequest {
  string account_id = 1;
  double amount = 2;
  string description = 3;
}

message TransferRequest {
  string from_account_id = 1;
  string to_account_id = 2;
  double amount = 3;
  string description = 4;
}

message GetHistoryRequest {
  string account_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}
